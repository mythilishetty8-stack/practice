<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      margin-top: 15%;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    button {
      background-color: white;
      color: #2575fc;
      border: none;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1.2em;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #f0f0f0;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Student Dashboard</h1>
    <p>Manage your academic journey with ease</p>
    <button onclick="location.href='signin.html'">Sign In</button>
    <button onclick="location.href='signup.html'">Sign Up</button>
  </div>
</body>
</html>
